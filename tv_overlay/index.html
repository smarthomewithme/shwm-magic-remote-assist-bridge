<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHWM Voice Overlay</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#notice{position:absolute;right:54px;bottom:52px;max-width:680px;min-width:300px;display:none;
  align-items:center;gap:20px;padding:22px 28px 22px 22px;
  background:rgba(18,22,30,.91);border:1px solid rgba(255,255,255,.23);border-radius:22px;
  box-shadow:0 12px 45px rgba(0,0,0,.4);pointer-events:none}
#notice.show{display:flex}
#bubble{width:64px;height:64px;flex:none;border-radius:18px;display:flex;align-items:center;justify-content:center;
  background:#244a7d}
#bubble svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;display:none}
#notice[data-kind="processing"] #bubble{background:#6544a5}
#notice[data-kind="done"] #bubble{background:#207f64}
#notice[data-kind="error"] #bubble{background:#9c414b}
#notice[data-kind="listen"] #mic,#notice[data-kind="processing"] #dots,
#notice[data-kind="done"] #check,#notice[data-kind="error"] #cross{display:block}
#text{font-size:29px;line-height:1.28;font-weight:500;overflow-wrap:break-word;max-width:540px}
#notice.no-icon #bubble{display:none}
</style></head>
<body><div id="notice" role="status" aria-live="off">
<div id="bubble">
<svg id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"></path></svg>
<svg id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="white"></circle><circle cx="12" cy="12" r="1.8" fill="white"></circle><circle cx="19" cy="12" r="1.8" fill="white"></circle></svg>
<svg id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"></path></svg>
<svg id="cross" viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"></path></svg>
</div><span id="text"></span></div>
<script>
(function(){
"use strict";
var notice=document.getElementById("notice"), label=document.getElementById("text");
var timeout=null;
function paramsOf(value){
  if(typeof value==="string"){try{value=JSON.parse(value)}catch(e){value={}}}
  if(!value||typeof value!=="object")value={};
  if(value.params&&typeof value.params==="object")return value.params;
  return value;
}
function passThrough(){
  try{if(window.PalmSystem&&PalmSystem.setInputRegion)
    PalmSystem.setInputRegion([{x:0,y:0,width:1,height:1}]);}catch(e){}
  try{if(window.PalmSystem&&PalmSystem.window&&PalmSystem.window.setFocus)
    PalmSystem.window.setFocus(false);}catch(e){}
}
function closeWindow(){
  notice.className="";label.textContent="";
  try{window.close()}catch(e){}
}
function draw(value){
  var p=paramsOf(value),message=typeof p.message==="string"?p.message.trim():"";
  if(!message){if(!timeout)timeout=setTimeout(closeWindow,250);return;}
  var kind=["listen","processing","done","error"].indexOf(p.kind)>=0?p.kind:"listen";
  // Text is always textContent, never parsed as HTML or JS.
  label.textContent=message.slice(0,140);
  notice.dataset.kind=kind;
  notice.className=p.icons===false?"show no-icon":"show";
  passThrough();
  if(timeout)clearTimeout(timeout);
  timeout=setTimeout(closeWindow,4400);
}
function current(){
  try{return window.PalmSystem?PalmSystem.launchParams:{}}catch(e){return {}}
}
window.webOSRelaunch=function(){draw(current());return true;};
document.addEventListener("webOSRelaunch",function(event){
  var p=event&&event.detail?event.detail:{};
  draw(p&&Object.keys(p).length?p:current());
},true);
draw(current());
}());
</script></body></html>
