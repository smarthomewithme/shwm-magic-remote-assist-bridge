name: SHWM Magic Remote Assist Bridge
version: 2.1.5
slug: shwm_magic_remote_bridge
description: Glasshouse MIC on rooted LG webOS to Home Assistant Assist
url: https://github.com/smarthomewithme/shwm-magic-remote-assist-bridge
stage: experimental
init: true
startup: application
boot: auto
arch:
  - amd64
  - aarch64
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_title: SHWM Magic Remote
panel_icon: mdi:remote
options:
  tv_host: 192.168.1.10
  tv_ssh_port: 22
  glasshouse_port: 8080
  remote_event_entity: event.lg_tv_remote_button
  record_seconds: 8
  execute_commands: false
  manual_test_enabled: false
  manual_audio_only: false
  vad_enabled: false
  mic_retry_enabled: true
  ssh_warmup_enabled: true
  tv_toasts_enabled: false
  vad_rms_threshold: 250
  vad_silence_ms: 1100
  log_transcript: false
  pipeline_id: ""
schema:
  tv_host: str
  tv_ssh_port: port
  glasshouse_port: port
  remote_event_entity: str
  record_seconds: int(5,20)
  execute_commands: bool
  manual_test_enabled: bool
  manual_audio_only: bool
  vad_enabled: bool
  mic_retry_enabled: bool
  ssh_warmup_enabled: bool
  tv_toasts_enabled: bool
  vad_rms_threshold: int(100,4000)
  vad_silence_ms: int(800,3500)
  log_transcript: bool
  pipeline_id: str?
